cover_rows:
  - label: goal
    paragraphs:
      - Identify where AI can reduce seller admin burden and improve deal execution across Keyloop's GTM org. Deliver a prioritized roadmap aligned to near-term, measurable impact.
  - label: context
    paragraphs:
      - Keyloop's GTM teams likely spend significant time on activities that surround the deal — meeting prep, note-taking, CRM updates, follow-up planning — rather than on the deal itself. AI capabilities have matured to the point where much of this surrounding work can be automated or augmented, freeing sellers to focus on what actually moves revenue.
      - This assessment will evaluate where Keyloop's GTM org stands today, what tools and workflows are already in place, and where targeted AI adoption can create the most immediate value.
  - label: methodology
    heading: Discovery interviews (8-10 hours)
    heading_color: "1B5E89"
    paragraphs:
      - Interview selected members of the GTM staff — sellers, sales managers, enablement, and RevOps — to gather firsthand evidence on common workflows, inefficiencies, pain points, and opportunities.
